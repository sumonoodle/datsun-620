# Build the Astro site and publish to GitHub Pages. Runs on push to main,
# manually, or called by daily-scrape.yml after the data commit.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When called from daily-scrape, pick up the data commit it just pushed.
          ref: ${{ github.ref_name }}
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 2026-09-01: the repo went private on 2026-08-31, which auto-disabled
      # Pages (free plan) and 404'd every deploy. enablement: true re-enables
      # Pages automatically as soon as the repo is public again, so a
      # visibility change never needs a manual Pages settings visit.
      - name: Ensure Pages is enabled
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
