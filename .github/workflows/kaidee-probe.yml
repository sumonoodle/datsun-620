# One-off: Kaidee started failing on a missing __NEXT_DATA__ payload. The
# sandbox has no egress to the site, so the probe runs here. Deleted once
# the collector is fixed.
name: kaidee-probe

on:
  push:
    branches:
      - claude/datsun-620-kickoff-ah5cyw
    paths:
      - scrapers/experiments/kaidee_probe.py
      # Editing this file must fire it too — a workflow repointed at a new
      # script changes only itself, matches no other path, and runs nothing.
      - .github/workflows/kaidee-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Probe Kaidee
        run: python scrapers/experiments/kaidee_probe.py
