# One-off: everycar.jp's search URL has 404'd for five daily runs. The
# sandbox has no egress to the site, so the probe runs here. Deleted once
# the collector is fixed.
name: everycar-probe

on:
  push:
    branches:
      - claude/datsun-620-kickoff-ah5cyw
    paths:
      - scrapers/experiments/everycar_probe.py
      - scrapers/experiments/everycar_probe2.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Probe everycar.jp
        run: python scrapers/experiments/everycar_probe2.py
