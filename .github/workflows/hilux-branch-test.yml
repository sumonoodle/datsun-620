# Live Hilux pipeline test on the development branch: runs the real Hilux
# collectors in the workflow workspace WITHOUT committing data, so the
# collectors are proven against live sites before they reach main. Same
# pattern as the 620's branch-pipeline-test; deleted once the Hilux ships.

name: hilux-branch-test

on:
  push:
    branches: [claude/hilux-rn30-truck-search-8zwn3l]
    paths:
      - .github/workflows/hilux-branch-test.yml
      - scrapers/common/**
      - scrapers/listings_hilux/**
      - scrapers/run_daily.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Run tests
        run: |
          for t in scrapers/tests/test_*.py; do
            python "$t"
          done
      - name: Run Hilux pipeline live (no commit)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          python scrapers/run_daily.py --model hilux
          echo "--- run log ---"
          cat data/hilux/run-log.json
          echo "--- listings ---"
          python -c "import json;[print(l['id'],'|',l['title'],'|',l['year'],'|',l.get('variant'),'|',l['url']) for l in json.load(open('data/hilux/listings.json'))['listings']]"
